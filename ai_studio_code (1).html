    function playChime(type = 'gentle') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        let notes = [523.25, 659.25, 783.99]; // C5, E5, G5
        if (type === 'uplifting') notes = [523.25, 659.25, 783.99, 1046.5];
        if (type === 'calm') notes = [392.00, 523.25, 659.25];

        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.15);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + idx * 0.15 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.15 + 0.85);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.15);
          osc.stop(ctx.currentTime + idx * 0.15 + 0.85);
        });
      } catch (e) {
        console.warn('Audio play failed:', e);
      }
    }

                      <span className="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-[#F2F4EF] text-[#8A9A5B] border border-[#E0E4D9]">
                        世界衛生組織 WHO 警示
                      </span>
                    </h3>
                    <p className="text-xs text-[#7F8C8D]">
                      每坐在電腦前 1 小時中斷久坐一次，能有效重啟脂蛋白脂肪酶，減少心血管疾病與全因死亡風險。
                    </p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setShowHealthDetails(!showHealthDetails)}
                  className="text-xs font-medium text-[#34495E] hover:text-[#2D3436] bg-[#F2F4EF] hover:bg-[#E0E4D9] px-3.5 py-1.5 rounded-full border border-[#E0E4D9] transition-colors flex items-center gap-1.5 cursor-pointer"
                >
                  <span>{showHealthDetails ? '收合醫學科普 🔼' : '查看久坐危害科普 🔽'}</span>
                </button>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div className="p-4 rounded-2xl bg-[#F9FAF7] border border-[#E0E4D9]">
                  <div className="text-xs text-[#7F8C8D] mb-1">今日站立次數</div>
                  <div className="text-2xl font-bold text-[#2D3436]">{standCount} <span className="text-xs font-normal text-[#7F8C8D]">次</span></div>
                  <div className="text-[11px] text-[#8A9A5B] mt-0.5">目標：每工作時數 1 次</div>
                </div>
                <div className="p-4 rounded-2xl bg-[#F9FAF7] border border-[#E0E4D9]">
                  <div className="text-xs text-[#7F8C8D] mb-1">補水杯數</div>
                  <div className="text-2xl font-bold text-[#2D3436]">{waterCount} <span className="text-xs font-normal text-[#7F8C8D]">杯</span></div>
                  <div className="text-[11px] text-[#7F8C8D] mt-0.5">約 {waterCount * 250} ml 飲水量</div>
                </div>
                <div className="p-4 rounded-2xl bg-[#F9FAF7] border border-[#E0E4D9]">
                  <div className="text-xs text-[#7F8C8D] mb-1">健康防護時數</div>
                  <div className="text-2xl font-bold text-[#2D3436]">{standCount} <span className="text-xs font-normal text-[#7F8C8D]">小時</span></div>
                  <div className="text-[11px] text-[#8A9A5B] mt-0.5">避免連續靜態久坐</div>
                </div>
                <div className="p-4 rounded-2xl bg-[#F9FAF7] border border-[#E0E4D9]">
                  <div className="text-xs text-[#7F8C8D] mb-1">防護達成率</div>
                  <div className="text-2xl font-bold text-[#2D3436]">{Math.min(100, Math.round((standCount / 8) * 100))}%</div>
                  <div className="text-[11px] text-[#8A9A5B] mt-0.5">{standCount >= 6 ? '表現極佳！' : '持續保持！'}</div>
                </div>
              </div>

              {showHealthDetails && (
                <div className="mt-4 pt-4 border-t border-[#E0E4D9] text-xs text-[#34495E] space-y-3">
                  <div className="p-4 bg-[#FDF2E9] rounded-2xl border border-[#F39C12]/30">
                    <h4 className="font-bold text-[#D35400] mb-1">⚠️ 為什麼辦公室久坐會「間接增加死亡風險」？</h4>
                    <p className="text-[#34495E] leading-relaxed">
                      根據《刺胳針》（The Lancet）與世界衛生組織研究，長時間連續坐著超過 60 分鐘，大腿肌群的電生理活動幾乎完全停止，分解血液脂肪的「脂蛋白脂肪酶（LPL）」活性驟降 90% 以上，導致血糖升高、血液濃稠與深層靜脈栓塞風險倍增。每天久坐超過 8 小時且無定時中斷者，全因死亡風險顯著增加 20%~40%。
                    </p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div className="p-3.5 bg-[#F9FAF7] rounded-2xl border border-[#E0E4D9]">
                      <span className="font-semibold text-[#2D3436] block mb-1">1. 單純站立即有奇效</span>
                      <span className="text-[#7F8C8D]">只要離開椅子站立，腿部與核心肌群即被喚醒，下肢靜脈瓣膜重新擠壓血液回流心臟，逆轉血管阻力。</span>
                    </div>
                    <div className="p-3.5 bg-[#F9FAF7] rounded-2xl border border-[#E0E4D9]">
                      <span className="font-semibold text-[#2D3436] block mb-1">2. 裝水建立動態習慣</span>
                      <span className="text-[#7F8C8D]">起身走到茶水間裝水能強迫雙眼看向 6 公尺以上遠方，舒緩睫狀肌，同時補充代謝所需水分子。</span>
                    </div>
                    <div className="p-3.5 bg-[#F9FAF7] rounded-2xl border border-[#E0E4D9]">
                      <span className="font-semibold text-[#2D3436] block mb-1">3. 心情與身體雙向調節</span>
                      <span className="text-[#7F8C8D]">身體姿勢影響血清素與皮質醇。在感到疲累或心情不佳時站立活動，能顯著降低焦慮與腦霧。</span>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* 頁腳 */}
          <footer className="border-t border-[#E0E4D9] bg-white py-4 text-center text-xs text-[#7F8C8D]">
            <p>活動提醒小助手 • 守護辦公室同仁身心健康 • 定時站立、補充水分與放鬆伸展，守護每一天</p>
          </footer>

          {/* 1 小時到期跳出提醒彈窗 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-slate-950/75 backdrop-blur-md overflow-y-auto">
              <div className="relative w-full max-w-3xl bg-[#F9FAF7] rounded-3xl shadow-2xl overflow-hidden border border-[#E0E4D9] my-auto">
                
                {/* 彈窗頂部 */}
                <div className="px-6 py-4 bg-white text-[#34495E] flex items-center justify-between border-b border-[#E0E4D9]">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-xl bg-[#8A9A5B] text-white flex items-center justify-center font-bold text-xs shadow-xs">
                      AI
                    </div>
                    <div>
                      <span className="font-semibold text-sm text-[#2D3436] flex items-center gap-2">
                        活動提醒小助手
                        <span className="text-[11px] font-normal px-2.5 py-0.5 rounded-full bg-[#F2F4EF] text-[#8A9A5B] border border-[#E0E4D9]">
                          時隔 1 小時健康喚醒
                        </span>
                      </span>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => playChime('calm')}
                      className="p-2 rounded-full text-[#7F8C8D] hover:text-[#2D3436] hover:bg-[#F2F4EF]"
                      title="播放冥想風鈴音"
                    >
                      🔔
                    </button>
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="p-2 rounded-full text-[#7F8C8D] hover:text-[#2D3436] hover:bg-[#F2F4EF]"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* 風景照片容器與多圖切換 */}
                <div className="relative h-56 sm:h-64 md:h-72 w-full overflow-hidden bg-slate-900 group">
                  <img
                    src={currentImage.url}
                    alt={currentImage.title}
                    className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#2D3436]/90 via-[#2D3436]/30 to-transparent pointer-events-none"></div>

                  {/* 切換上一張 / 下一張 */}
                  <button
                    type="button"
                    onClick={() => setCurrentImageIndex((currentImageIndex - 1 + activeConfig.images.length) % activeConfig.images.length)}
                    className="absolute inset-y-0 left-3 my-auto h-10 w-10 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center text-lg backdrop-blur-xs"
                    title="上一張風景"
                  >
                    ◀
                  </button>
                  <button
                    type="button"
                    onClick={() => setCurrentImageIndex((currentImageIndex + 1) % activeConfig.images.length)}
                    className="absolute inset-y-0 right-3 my-auto h-10 w-10 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center text-lg backdrop-blur-xs"
                    title="下一張風景"
                  >
                    ▶
                  </button>

                  {/* 心情標籤 */}
                  <div className="absolute top-3 left-3 flex flex-wrap gap-2 items-center">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold shadow-sm backdrop-blur-md bg-white/90 text-[#2D3436]">
                      <span>{activeConfig.emoji}</span>
                      <span>{activeConfig.label} 專屬風景</span>
                    </span>
                    {isTodayHighStress && (
                      <span className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold bg-[#FDF2E9] text-[#F39C12] border border-[#F39C12]/40">
                        🔥 高壓日加強關懷
                      </span>
                    )}
                  </div>

                  {/* 風景資訊與 6 款圖片微型切換條 */}
                  <div className="absolute bottom-3 left-5 right-5 text-white">
                    <div className="flex items-center justify-between gap-2 text-xs mb-1">
                      <div className="flex items-center gap-1.5 text-[#BDC317] font-medium truncate">
                        <span>📍 {currentImage.location}</span>
                        <span className="text-white/60">•</span>
                        <span className="text-white/80">{currentImageIndex + 1} / {activeConfig.images.length} 張風景</span>
                      </div>

                      {/* 圖片切換指示點 */}
                      <div className="flex items-center gap-1.5 bg-black/40 backdrop-blur-md p-1 px-2 rounded-full border border-white/20">
                        {activeConfig.images.map((img, idx) => (
                          <button
                            key={img.id}
                            type="button"
                            onClick={() => setCurrentImageIndex(idx)}
                            title={img.title}
                            className={`h-2 rounded-full transition-all cursor-pointer ${
                              currentImageIndex === idx ? 'w-6 bg-white' : 'w-2 bg-white/40 hover:bg-white/80'
                            }`}
                          />
                        ))}
                      </div>
                    </div>
                    <h2 className="text-lg sm:text-xl font-bold text-white drop-shadow-md truncate">{currentImage.title}</h2>
                    <p className="text-xs text-white/90 line-clamp-1 mt-0.5">{currentImage.moodVibe}</p>
                  </div>
                </div>

                {/* 彈窗主體內容 */}
                <div className="p-5 sm:p-6 space-y-4">
                  
                  {/* 久坐急迫警告條 */}
                  <div className="flex items-start gap-3 p-4 rounded-2xl bg-[#FDF2E9] border border-[#F39C12]/30 text-[#D35400]">
                    <div className="w-8 h-8 rounded-xl bg-white text-[#F39C12] flex items-center justify-center shrink-0 mt-0.5 font-bold shadow-xs">
                      ⚠️
                    </div>
                    <div className="text-xs sm:text-sm">
                      <span className="font-bold text-[#D35400]">您已經在電腦前坐滿 60 分鐘！</span>
                      <span className="text-[#34495E] ml-1">
                        醫學研究證實，久坐會使下肢循環驟降、肌肉電活動歸零，並間接增加心血管與全因死亡風險。只要現在
                        <strong className="font-bold text-[#D35400]"> 起身站立 2~3 分鐘</strong>，就能迅速重啟新陳代謝！
                      </span>
                    </div>
                  </div>

                  {/* AI 智能關懷語 */}
                  <div className="bg-white rounded-2xl p-5 border border-[#E0E4D9]">
                    <div className="flex items-center justify-between mb-2.5">
                      <div className="flex items-center gap-2 text-xs font-bold text-[#2D3436]">
                        <span>✨ 活動提醒小助手 AI 智能關懷語</span>
                      </div>
                      <span className="text-[11px] text-[#7F8C8D] font-medium">
                        {isTodayHighStress ? `排程高壓時段（${currentDayName}）` : '平穩常態工作'}
                      </span>
                    </div>

                    <div className="space-y-3 text-[#34495E] text-xs sm:text-sm leading-relaxed">
                      <p className="font-semibold text-[#2D3436] text-sm">{activeConfig.advice.greeting}</p>
                      <p className="text-[#7F8C8D]">{activeConfig.advice.comfortMessage}</p>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                        <div className="bg-[#F9FAF7] p-3.5 rounded-xl border border-[#E0E4D9]">
                          <span className="font-semibold text-[#2D3436] text-xs block mb-0.5">🏃 推薦活動/伸展</span>
                          <span className="text-xs text-[#7F8C8D]">{activeConfig.advice.activityTip}</span>
                        </div>
                        <div className="bg-[#F9FAF7] p-3.5 rounded-xl border border-[#E0E4D9]">
                          <span className="font-semibold text-[#2D3436] text-xs block mb-0.5">💧 水分補給</span>
                          <span className="text-xs text-[#7F8C8D]">{activeConfig.advice.waterTip}</span>
                        </div>
                      </div>

                      {activeConfig.advice.breathingTip && (
                        <div className="bg-[#F4F9F2] p-3 rounded-xl border border-[#8A9A5B]/30 text-xs text-[#8A9A5B]">
                          <span>🌬️ <strong>微呼吸練習：</strong>{activeConfig.advice.breathingTip}</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* 起身打卡勾選三步驟 */}
                  <div>
                    <h4 className="text-xs font-semibold text-[#2D3436] mb-2 flex items-center justify-between">
                      <span>起身行動打卡（勾選後累積守護紀錄）：</span>
                      <span className="text-[11px] font-normal text-[#7F8C8D]">只需花費 2-3 分鐘</span>
                    </h4>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      <button
                        type="button"
                        onClick={() => setStoodUp(!stoodUp)}
                        className={`p-3.5 rounded-2xl border text-left transition-all flex items-center justify-between cursor-pointer ${
                          stoodUp ? 'bg-[#F4F9F2] border-[#8A9A5B] text-[#8A9A5B]' : 'bg-white border-[#E0E4D9] text-[#7F8C8D]'
                        }`}
                      >
                        <div>
                          <span className="text-xs font-semibold block">1. 離開椅子站立</span>
                          <span className="text-[10px] text-[#7F8C8D]">走動或單純站著</span>
                        </div>
                        <span className="text-lg">{stoodUp ? '✅' : '⚪'}</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setDrankWater(!drankWater)}
                        className={`p-3.5 rounded-2xl border text-left transition-all flex items-center justify-between cursor-pointer ${
                          drankWater ? 'bg-[#F4F9F2] border-[#8A9A5B] text-[#8A9A5B]' : 'bg-white border-[#E0E4D9] text-[#7F8C8D]'
                        }`}
                      >
                        <div>
                          <span className="text-xs font-semibold block">2. 裝一杯溫水</span>
                          <span className="text-[10px] text-[#7F8C8D]">補充 250ml 水分</span>
                        </div>
                        <span className="text-lg">{drankWater ? '✅' : '⚪'}</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setStretched(!stretched)}
                        className={`p-3.5 rounded-2xl border text-left transition-all flex items-center justify-between cursor-pointer ${
                          stretched ? 'bg-[#F4F9F2] border-[#8A9A5B] text-[#8A9A5B]' : 'bg-white border-[#E0E4D9] text-[#7F8C8D]'
                        }`}
                      >
                        <div>
                          <span className="text-xs font-semibold block">3. 伸展或深呼吸</span>
                          <span className="text-[10px] text-[#7F8C8D]">放鬆肩頸與雙眼</span>
                        </div>
                        <span className="text-lg">{stretched ? '✅' : '⚪'}</span>
                      </button>
                    </div>
                  </div>

                  {/* 心情快速切換 */}
                  <div className="pt-2 border-t border-[#E0E4D9] flex flex-wrap items-center justify-between gap-2 text-xs text-[#7F8C8D]">
                    <span>若心情有所轉變，可直接切換：</span>
                    <div className="flex items-center gap-1.5">
                      {['very_happy', 'happy', 'neutral', 'bad', 'very_bad'].map(mKey => (
                        <button
                          key={mKey}
                          type="button"
                          onClick={() => {
                            setCurrentMood(mKey);
                            setCurrentImageIndex(0);
                          }}
                          className={`px-2.5 py-1 rounded-full text-xs font-medium border cursor-pointer ${
                            currentMood === mKey ? 'bg-[#8A9A5B] text-white border-[#8A9A5B]' : 'bg-white text-[#7F8C8D] border-[#E0E4D9]'
                          }`}
                        >
                          {MOOD_CONFIGS[mKey].label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* 彈窗底座操作區 */}
                <div className="px-6 py-4 bg-white border-t border-[#E0E4D9] flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <button
                      type="button"
                      onClick={() => handleSnooze(5)}
                      className="w-full sm:w-auto px-4 py-2.5 rounded-2xl text-xs font-semibold text-[#34495E] bg-white hover:bg-[#F2F4EF] border border-[#E0E4D9] cursor-pointer"
                    >
                      ⏱️ 再休息 5 分鐘後提醒
                    </button>
                    <button
                      type="button"
                      onClick={() => setCurrentImageIndex((currentImageIndex + 1) % activeConfig.images.length)}
                      className="px-3 py-2.5 rounded-2xl text-xs font-medium text-[#7F8C8D] hover:text-[#2D3436] hover:bg-[#F2F4EF] border border-[#E0E4D9] cursor-pointer"
                    >
                      🖼️ 換一張風景 ({currentImageIndex + 1}/{activeConfig.images.length})
                    </button>
                  </div>

                  <button
                    type="button"
                    onClick={handleCompleteSession}
                    className="w-full sm:w-auto px-6 py-3 rounded-2xl text-sm font-semibold text-white bg-[#8A9A5B] hover:bg-[#78884C] shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <span>✅ 完成打卡，開始下一個 1 小時</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
